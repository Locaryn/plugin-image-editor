[package]
name = "locaryn-plugin-image-editor"
version = "1.1.0"
edition = "2021"
description = "Official Locaryn Extension: Image Editing, Inpainting & Canvas Region Masking"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "locaryn-image-editor-mcp"
path = "src/bin/image_editor_mcp.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
walkdir = "2"

[workspace]
